<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D2 Monument Archive</title>
  <link rel="stylesheet" href="./styles.css?v=20260614-armor-mod-slots-v2">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="brand-kicker">D2 Monument Archive</p>
      <h1 id="pageTitle">データベース</h1>
      <p class="manifest" id="manifestMeta">Manifest</p>
    </div>
    <div class="header-actions">
      <div class="lang-switch" aria-label="Language">
        <button class="seg" id="langJa" type="button" aria-pressed="true">日本語</button>
        <button class="seg" id="langEn" type="button" aria-pressed="false">English</button>
      </div>
      <div class="theme-switch" aria-label="Theme">
        <button class="seg" id="themeWhite" type="button" aria-pressed="true">ホワイト</button>
        <button class="seg" id="themeBlack" type="button" aria-pressed="false">ブラック</button>
      </div>
    </div>
  </header>

  <section class="taxonomy-shell" aria-label="Catalog navigation">
    <nav class="group-nav" id="groupNav" aria-label="Major categories"></nav>
    <div class="section-rail" id="sectionRail" aria-label="Subcategories"></div>
  </section>

  <section class="summary-band" id="summaryBand" aria-label="Summary"></section>

  <main class="catalog-shell">
    <aside class="browse-panel">
      <div class="search-row">
        <label class="field search-field">
          <span id="searchLabel">検索</span>
          <input id="searchInput" type="search" autocomplete="off">
        </label>
        <button class="clear-btn" id="clearButton" type="button">Reset</button>
      </div>

      <div class="filter-grid">
        <label class="field">
          <span id="filterPrimaryLabel">タイプ</span>
          <select id="primaryFilter"></select>
        </label>
        <label class="field">
          <span id="filterSecondaryLabel">弾薬</span>
          <select id="secondaryFilter"></select>
        </label>
        <label class="field">
          <span id="filterTertiaryLabel">属性</span>
          <select id="tertiaryFilter"></select>
        </label>
        <label class="field">
          <span id="filterQuaternaryLabel">スロット</span>
          <select id="quaternaryFilter"></select>
        </label>
        <label class="field">
          <span id="filterQuinaryLabel">世代</span>
          <select id="quinaryFilter"></select>
        </label>
        <label class="field">
          <span id="filterSenaryLabel">シーズン</span>
          <select id="senaryFilter"></select>
        </label>
        <label class="field">
          <span id="sortLabel">並び替え</span>
          <select id="sortSelect"></select>
        </label>
      </div>

      <div class="result-head">
        <span id="resultStatus">0</span>
        <span id="activeFilterLabel"></span>
      </div>

      <div class="column-head" id="columnHead"></div>
      <div class="results" id="results" aria-live="polite"></div>
    </aside>

    <section class="detail-panel" id="detail">
      <div class="empty-state">
        <h2 id="emptyTitle">項目</h2>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260614-armor-mod-slots-v2"></script>
</body>
</html>
